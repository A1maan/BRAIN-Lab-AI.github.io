<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BRAIN Lab | Makeover preview</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e5e8ee;color:#202733;display:flex;flex-direction:column}header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;background:#fbfcfd;border-bottom:1px solid #d8dce3;flex-wrap:wrap}header strong{font-weight:650;font-size:14px}header small{display:block;font-size:11px;color:#626b79;margin-top:3px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}fieldset{border:0;padding:0;margin:0;display:flex;gap:2px}legend{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}button,a{font:inherit;color:inherit}button{border:0;background:transparent;cursor:pointer;padding:9px 12px;min-height:38px;border-radius:6px}button[aria-pressed="true"]{background:#e8ecf3;color:#1a2a6c;font-weight:600}button:hover{background:#eef0f4}button:focus-visible,a:focus-visible{outline:2px solid #1a2a6c;outline-offset:3px}a{text-underline-offset:3px}main{flex:1;min-height:0;display:flex;justify-content:center;padding:0;overflow:hidden}iframe{display:block;border:0;width:100%;height:100%;background:#f7f8fa}main[data-size="phone"]{padding:20px}main[data-size="phone"] iframe{max-width:390px;border-radius:20px;box-shadow:0 0 0 5px #303745}main[data-size="small"]{padding:20px}main[data-size="small"] iframe{max-width:320px;border-radius:20px;box-shadow:0 0 0 5px #303745}@media(max-width:700px){header{padding:10px 14px;gap:10px}.controls{gap:5px}button{font-size:12px;padding:8px}header>a{font-size:12px}main[data-size="phone"],main[data-size="small"]{padding:10px}}
</style></head><body>
<header><div><strong>BRAIN Lab / Makeover preview</strong><small>Concept for review. Original website unchanged.</small></div><div class="controls"><fieldset data-control="page"><legend>Page</legend><button type="button" data-value="index" aria-pressed="true">Home</button><button type="button" data-value="members" aria-pressed="false">Members</button><button type="button" data-value="projects" aria-pressed="false">Projects</button></fieldset><fieldset data-control="motion"><legend>Hero motion</legend><button type="button" data-value="film" aria-pressed="false">Research film</button><button type="button" data-value="brain" aria-pressed="true">Particle brain</button><button type="button" data-value="surface" aria-pressed="false">Flowing surface</button><button type="button" data-value="still" aria-pressed="false">Still</button></fieldset><fieldset data-control="size"><legend>Preview size</legend><button type="button" data-value="desktop" aria-pressed="true">Desktop</button><button type="button" data-value="phone" aria-pressed="false">Phone</button><button type="button" data-value="small" aria-pressed="false">320px</button></fieldset><fieldset data-control="appearance"><legend>Appearance</legend><button type="button" data-value="light" aria-pressed="true">Light</button><button type="button" data-value="dark" aria-pressed="false">Dark</button></fieldset></div><a id="open-page" href="index.html?appearance=light" target="_blank" rel="noopener">Open page ↗</a></header>
<main data-size="desktop"><iframe title="BRAIN Lab design preview" src="about:blank"></iframe></main>
<script>
const initialMotion=new URLSearchParams(location.search).get('motion');
const state={page:'index',size:'desktop',appearance:'light',motion:['film','brain','surface','still'].includes(initialMotion)?initialMotion:'film'};
function pageSource(){return state.page+'.html?appearance='+state.appearance+'&motion='+state.motion;}
document.querySelector('iframe').src=pageSource();
document.querySelector('#open-page').href=pageSource();
document.querySelectorAll('[data-control="motion"] button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.value===state.motion)));
document.querySelectorAll('fieldset').forEach(group=>group.addEventListener('click',event=>{
  const button=event.target.closest('button');if(!button)return;
  state[group.dataset.control]=button.dataset.value;
  if(group.dataset.control==='motion')state.page='index';
  group.querySelectorAll('button').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
  document.querySelector('main').dataset.size=state.size;
  if(group.dataset.control!=='size'){
    const source=pageSource();
    document.querySelector('iframe').src=source;
    document.querySelector('#open-page').href=source;
  }
}));
// Keep the review controls accurate when visitors follow links inside the preview.
document.querySelector('iframe').addEventListener('load',event=>{
  const frameDocument=event.target.contentDocument;
  if(!frameDocument)return;
  const framePath=new URL(frameDocument.URL).pathname;
  const studyPath=location.pathname.slice(0,location.pathname.lastIndexOf('/')+1);
  if(!framePath.startsWith(studyPath))return;
  const current=framePath.split('/').pop().replace('.html','');
  if(!['index','members','projects'].includes(current))return;
  state.page=current;
  document.querySelectorAll('[data-control="page"] button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.value===current)));
  document.querySelector('#open-page').href=pageSource();
});
</script></body></html>
